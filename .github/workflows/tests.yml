name: tests

on:
  push:
  pull_request:

jobs:
  cli:
    name: htask on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover tests -v

  mod:
    name: App mod syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Herdr isn't available here, so `herdr-app check` can't run. node --check parses each file
      # as an ES module without running it or resolving its imports, which catches syntax errors.
      - name: Parse every mod file
        run: |
          for f in mods/htask/*.js; do
            cp "$f" "$RUNNER_TEMP/$(basename "$f" .js).mjs"
            node --check "$RUNNER_TEMP/$(basename "$f" .js).mjs"
            echo "ok $f"
          done
